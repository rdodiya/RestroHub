# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/RestroHub_DB
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================
# HikariCP
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=false

# ===============================
# SpringDoc OpenAPI / Swagger
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ===============================
# Logging
# ===============================
logging.level.com.restrohub=DEBUG

# Maximum size per file
spring.servlet.multipart.max-file-size=10MB
# Maximum total request size (all files + form data)
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Security / JWT
# ===============================
security.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3002}

# ===============================
# Google OAuth 2.0
# ===============================

# --- Google OAuth 2.0 Credentials ---
# Create your client credentials in the Google Cloud Console:
# https://console.cloud.google.com/apis/credentials
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:YOUR_GOOGLE_OAUTH_CLIENT_ID_HERE}
google.oauth.enabled=${GOOGLE_OAUTH_ENABLED:true}

# ===============================
# Cloudinary
# ===============================
# Set these environment variables locally. Blank values fail startup validation.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test}
cloudinary.api-key=${CLOUDINARY_API_KEY:test}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test}

# ===============================
# Service Requests Configuration
# ===============================
service.request.types=CALL_WAITER,REQUEST_BILL
